<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teechat - Story Platform</title>

  <!-- 1. Apple Touch Icon dành riêng cho iPhone / iOS -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.postimg.cc/1X9mKqH9/Thi-t-k-ch-a-c-t-n-1.png">

  <!-- 2. Favicon cho tab trình duyệt Máy tính / Android -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://i.postimg.cc/1X9mKqH9/Thi-t-k-ch-a-c-t-n-1.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://i.postimg.cc/1X9mKqH9/Thi-t-k-ch-a-c-t-n-1.png">
  <link rel="shortcut icon" href="https://i.postimg.cc/1X9mKqH9/Thi-t-k-ch-a-c-t-n-1.png">

  <!-- 3. Cấu hình Web App Manifest chuẩn PWA -->
  <link rel="manifest" href='data:application/json,{"name":"Teechat - Story Platform","short_name":"Teechat","start_url":"./","display":"standalone","background_color":"#e7f5ee","theme_color":"#e7f5ee","icons":[{"src":"https://i.postimg.cc/1X9mKqH9/Thi-t-k-ch-a-c-t-n-1.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>

  <!-- Thư viện Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Icon FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Font chữ Caveat tạo kiểu chữ viết tay cho logo Teechat -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #e7f5ee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-handwriting {
      font-family: 'Caveat', cursive;
    }
  </style>

  <!-- Thư viện React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const DEFAULT_LOGO = 'https://i.postimg.cc/1X9mKqH9/Thi-t-k-ch-a-c-t-n-1.png';

    function App() {
      return (
        <div class="min-h-screen pb-10">
          {/* Header */}
          <header class="bg-white/80 backdrop-blur border-b border-emerald-100 sticky top-0 z-50 px-4 py-3">
            <div class="max-w-4xl mx-auto flex items-center justify-between">
              
              {/* Logo & Tên Web */}
              <div class="flex items-center gap-3">
                <img 
                  src={DEFAULT_LOGO} 
                  alt="Teechat Logo" 
                  class="w-10 h-10 rounded-full object-cover border border-emerald-200 shadow-sm"
                />
                <span class="font-handwriting text-3xl font-bold text-emerald-700">Teechat</span>
              </div>

              {/* Thao tác góc phải */}
              <div class="flex items-center gap-2">
                <button class="px-3 py-1.5 rounded-full border border-emerald-300 text-emerald-700 bg-emerald-50 text-sm font-medium flex items-center gap-1.5 shadow-sm hover:bg-emerald-100 transition">
                  <i class="fa-solid fa-cloud"></i> Đồng Bộ
                </button>
                <button class="px-3 py-1.5 rounded-full border border-purple-200 text-purple-700 bg-purple-50 text-sm font-medium flex items-center gap-1.5 shadow-sm hover:bg-purple-100 transition">
                  <i class="fa-solid fa-user"></i> Hồ Sơ
                </button>
                <button class="px-3 py-1.5 rounded-full border border-teal-200 text-teal-700 bg-teal-50 text-sm font-medium flex items-center gap-1.5 shadow-sm hover:bg-teal-100 transition">
                  <i class="fa-solid fa-gear"></i> Cài Đặt
                </button>
              </div>

            </div>
          </header>

          {/* Main Content */}
          <main class="max-w-4xl mx-auto px-4 mt-6">
            <div class="flex items-center justify-between mb-6">
              <h1 class="font-handwriting text-4xl font-bold text-emerald-800">Danh Sách Truyện</h1>
              <button class="px-4 py-2 rounded-full bg-pink-400 hover:bg-pink-500 text-white font-medium shadow-md transition flex items-center gap-2">
                <span>+</span> Tạo Truyện Mới
              </button>
            </div>

            {/* Danh sách thẻ truyện mẫu */}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="bg-white p-4 rounded-2xl border border-emerald-100 shadow-sm hover:shadow-md transition">
                <div class="flex items-center gap-3 mb-2">
                  <img src={DEFAULT_LOGO} class="w-12 h-12 rounded-full border border-emerald-200" />
                  <div>
                    <h3 class="font-bold text-lg text-gray-800">Trần Hạo Nam & Băng Đảng</h3>
                    <p class="text-xs text-gray-500">Cuộc chiến địa bàn gay cấn tại Chợ...</p>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
